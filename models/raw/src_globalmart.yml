version: 2

sources:
  - name: globalmart
    description: a clone of the Snowflake Database
    database: TALAN_ODS
    schema: DBT_EJEMLI_RAW_GLOBALMART
    tables:
      - name: customer
      - name: orders
        description: raw orders table
        columns:
          - name: orderid
            description: primary key for orders
            tests:
              - unique
              - not_null
      - name: product


